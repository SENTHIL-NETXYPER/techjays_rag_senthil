<!DOCTYPE html>
<html>
<head>
    <title>Upload Document</title>
    <meta charset="utf-8">
<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    #app {
        display: flex;
        height: 100vh;
    }

    /* ---------- Sidebar ---------- */

    #sidebar {
        width: 220px;
        padding: 15px;
        border-right: 1px solid #ccc;
        display: flex;
        flex-direction: column;
    }

    #sidebar h2 {
        margin: 0 0 10px 0;
    }

    #sidebar a {
        display: block;
        margin-bottom: 10px;
        text-decoration: none;
        color: #000;
        border: 1px solid #ccc;
        padding: 6px 10px;
    }

    #sidebar a:hover {
        background: #eee;
    }

    /* ---------- Main ---------- */

    #main-chat {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    #main-chat header {
        padding: 15px;
        border-bottom: 1px solid #ccc;
    }

    #main-chat header h2 {
        margin: 0 0 5px 0;
    }

    #main-chat header p {
        margin: 0;
        color: #555;
    }

    #upload-area {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        max-width: 500px;
    }

    .error {
        color: red;
        border: 1px solid red;
        padding: 8px;
        margin-bottom: 15px;
    }

    .box {
        border: 1px solid #ddd;
        padding: 15px;
    }

    #upload-area form input {
        width: 100%;
        padding: 8px;
        margin: 5px 0 15px;
        font-family: inherit;
        font-size: 14px;
    }

    button {
        padding: 6px 14px;
        cursor: pointer;
    }

</style>
</head>

<body>

    <div id="app">

        <!-- Sidebar -->
        <aside id="sidebar">

            <h2>Documents</h2>

            <a href="{% url 'document_list' %}">My Documents</a>

        </aside>


        <!-- Main -->
        <main id="main-chat">

            <header>
                <h2>RAGVault  </h2>
                <p>documents + secure knowledge</p>
            </header>


            <div id="upload-area">

                {% if error %}
                    <div class="error">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="box">

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit">
                            Upload Document
                        </button>

                    </form>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
