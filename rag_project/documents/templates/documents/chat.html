<!DOCTYPE html>
<html>

<head>
    <title>Document Chat</title>
    <meta charset="utf-8">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* ---------- Sidebar ---------- */

        #sidebar {
            width: 220px;
            padding: 15px;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        #sidebar h2 {
            margin: 0 0 10px 0;
        }

        #sidebar a {
            display: block;
            margin-bottom: 10px;
            text-decoration: none;
            color: #000;
            border: 1px solid #ccc;
            padding: 6px 10px;
        }

        #sidebar a:hover {
            background: #eee;
        }

        #sidebar h3 {
            margin: 10px 0 5px 0;
            font-size: 13px;
        }

        #sidebar form {
            margin-top: 10px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        #sidebar form button {
            width: 100%;
        }

        /* ---------- Main Chat ---------- */

        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #main-chat header {
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }

        #main-chat header h2 {
            margin: 0 0 5px 0;
        }

        #main-chat header p {
            margin: 0;
            color: #555;
        }

        /* ---------- Chat Messages ---------- */

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin-bottom: 15px;
        }

        .question {
            background: #000;
            color: #fff;
            padding: 10px;
            margin-bottom: 5px;
        }

        .answer {
            border: 1px solid #ddd;
            padding: 10px;
            background: #fff;
        }

        .label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* ---------- Input ---------- */

        #main-chat > form {
            padding: 15px;
            border-top: 1px solid #ccc;
            display: flex;
            gap: 8px;
        }

        #main-chat input[type="text"] {
            flex: 1;
            padding: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            padding: 6px 14px;
            cursor: pointer;
        }

    </style>

</head>


<body>

<div id="app">


    <!-- Sidebar -->

    <aside id="sidebar">

        <h2>Document Chat</h2>

        <a href="{% url 'upload' %}">
            + Upload Another
        </a>

        <h3>Manage</h3>

        <a href="{% url 'document_list' %}">
            My Documents
        </a>

        <form method="post"
              action="{% url 'delete_doc' document_id %}">

            {% csrf_token %}

            <button type="submit">
                Delete This Document
            </button>

        </form>

    </aside>


    <!-- Main Chat -->

    <main id="main-chat">


        <header>

            <h2>
                RAGVault
            </h2>

            <p>
                Ask questions based on the uploaded document.
            </p>

        </header>


        <!-- Chat History -->

        <div id="chat-box">


            {% for message in messages %}

                <div class="message">

                    <!-- User Question -->

                    <div class="question">

                        <div class="label">
                            You
                        </div>

                        {{ message.question }}

                    </div>


                    <!-- AI Answer -->

                    <div class="answer">

                        <div class="label">
                            AI
                        </div>

                        {{ message.answer }}

                    </div>

                </div>

            {% empty %}

                <p>
                    Ask something about this document.
                </p>

            {% endfor %}


        </div>


        <!-- Message Input -->

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="question"
                placeholder="Ask a question..."
                required
            >

            <button type="submit">
                Ask
            </button>

        </form>


    </main>


</div>

</body>

</html>
